<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="title">Library Management System</h1>
    <div class="container" id="container1">
    <div id="Author" class="d">
        <img src="author.jpg" alt="Author Image" id="authorImage" class="profileimage">
        <button id="authorButton" class="btn">Author</button>
    </div>
    <div id="Book" class="d">
        <img src="book.png" alt="Book Image" id="bookImage" class="profileimage">
        <button id="bookButton" class="btn">Book</button>
    </div>
    <div id="Student" class="d">
        <img src="student.png" alt="Student Image" id="studentImage" class="profileimage">
        <button id="studentButton" class="btn">Student</button>
    </div>
    </div>
    <div class="container" id="container2">
    <div id="Faculty" class="d">
        <img src="Faculty.png" alt="Faculty Image" id="facultyImage" class="profileimage">
        <button id="facultyButton" class="btn">Faculty</button>
    </div>
    <div id="Transaction" class="d">
        <img src="transaction.png" alt="Transaction Image" id="transactionImage" class="profileimage">
        <button id="transactionButton" class="btn">Transaction</button>
    </div>
    <div id="Publish" class="d">
        <img src="publish.png" alt="Publish Image" id="publishImage" class="profileimage">
        <button id="publishButton" class="btn">Publisher</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
