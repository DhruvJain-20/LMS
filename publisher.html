<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publisher Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="management-page">

    <h1 class="page-title">Publisher Management</h1>

    <div class="page-container">

        <div class="form-card">

            <h2>Add Publisher</h2>

            <label for="publisherName">Publisher Name</label>
            <input type="text" id="publisherName" placeholder="Enter publisher name">

            <label for="publisherEmail">Email</label>
            <input type="email" id="publisherEmail" placeholder="Enter email">

            <button class="action-btn" id="addPublisherBtn">Add Publisher</button>

        </div>


        <div class="table-card">

            <h2>Publisher Records</h2>

            <table>
                <thead>
                    <tr>
                        <th>Publisher ID</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody id="publisherTableBody">
                    <!-- MySQL data will appear here -->
                </tbody>
            </table>

        </div>

    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">
        Back to Home
    </button>
    <script src="publisher.js"></script>
</body>
</html>
